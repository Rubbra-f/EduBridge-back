# Include this location in the HTTPS server block serving the EduBridge frontend.
# Create /etc/nginx/secrets/edubridge-api-key.conf (root-readable only) with:
#   set $edubridge_api_key "your_backend_api_key";
# Do not commit that secret file.
include /etc/nginx/secrets/edubridge-api-key.conf;

location /api/edubridge/ {
    proxy_pass http://127.0.0.1:8000/api/v1/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-API-Key $edubridge_api_key;
    proxy_read_timeout 60s;
}
